name: Fork build and tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel:
    if: github.repository == 'Sim-md/ConEmu'
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
            suffix: ''
            machine: 014C
          - arch: x64
            platform: x64
            suffix: '64'
            machine: 8664
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: >
          msbuild src/CE.sln /m:3 /v:minimal
          '/t:ConEmu;ConEmuC;ConEmuCD;ConEmuHk;Far_ConEmuPlugin;Far_ConEmuBg;Far_ConEmuLn;Far_ConEmuTh;Far_ConEmuTh_gdi+;Far_ConEmuTh_ico;Far_ConEmuTh_pe;Tests'
          /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
      - name: Run unit tests and verify GUI architecture
        run: |
          & "./Release/Tests_Release_${{ matrix.platform }}.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path './Release/ConEmu${{ matrix.suffix }}.exe').Path)
          $machine = '{0:X4}' -f [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 60) + 4)
          if ($machine -ne '${{ matrix.machine }}') { throw "Unexpected PE machine: $machine" }
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            Release/ConEmu${{ matrix.suffix }}.exe
            Release/ConEmu/ConEmuC${{ matrix.suffix }}.exe
            Release/ConEmu/ConEmuCD${{ matrix.suffix }}.dll
            Release/ConEmu/ConEmuHk${{ matrix.suffix }}.dll
            Release/plugins/ConEmu/**/*.dll
            Release/plugins/ConEmu/**/*.t32
            Release/plugins/ConEmu/**/*.t64
          if-no-files-found: error
          retention-days: 7

  arm64:
    if: github.repository == 'Sim-md/ConEmu'
    name: Build Windows ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install LLVM-MinGW
        run: |
          archive=llvm-mingw-20261104-ucrt-ubuntu-22.04-aarch64.tar.xz
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$archive"
          echo "595e95bdffabfc62559fe26e30bdfbccf277cbaed4902793555015ee47306b94  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xf "$RUNNER_TEMP/$archive" --strip-components=1 -C "$RUNNER_TEMP/llvm-mingw"
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
      - name: Build pinned Microsoft Detours
        run: |
          detours="$RUNNER_TEMP/detours"
          git init -q "$detours"
          git -C "$detours" fetch --depth=1 https://github.com/microsoft/Detours.git 1dbd4ea281d73d478aa8d09a8b83fbd265f715f7
          git -C "$detours" checkout --detach FETCH_HEAD
          for source in detours modules disasm image creatwth disolx86 disolx64 disolia64 disolarm disolarm64; do
            aarch64-w64-mingw32-clang++ -std=c++17 -O2 -DWIN32_LEAN_AND_MEAN -D_WIN32_WINNT=0x0601 \
              -DDETOUR_DEBUG=0 -fms-extensions -D__STRSAFE__NO_INLINE -c "$detours/src/$source.cpp" -o "$detours/$source.o"
          done
          llvm-ar rcs "$detours/libdetours.a" "$detours"/*.o
          echo "DETOURS_LIB=$detours/libdetours.a" >> "$GITHUB_ENV"
          echo "DETOURS_INCLUDE=$detours/src" >> "$GITHUB_ENV"
      - name: Build ConEmu with ARM64 hooks and Far plugins
        run: sh build-arm64.sh
      - name: Build ConPTY tests
        run: |
          mkdir -p Release-arm64/tests
          sources=src/UnitTests/ConPty
          aarch64-w64-mingw32-clang++ -std=c++17 -O1 -static "$sources/ConPtyInput_test.cpp" -o Release-arm64/tests/Input.exe -lole32
          aarch64-w64-mingw32-clang++ -std=c++17 -O1 -static -municode -include crtdbg.h -Wno-c++11-narrowing "$sources/ConPtyHistory_test.cpp" -o Release-arm64/tests/History.exe
          aarch64-w64-mingw32-clang++ -std=c++17 -O1 -static -municode "$sources/ConPtyHistoryChild.cpp" -o Release-arm64/tests/HistoryChild.exe
          aarch64-w64-mingw32-clang++ -std=c++17 -O2 -static -municode .github/scripts/fork-update-hook-probe.cpp -o Release-arm64/tests/HookUpdateProbe.exe
          tar -cf "$RUNNER_TEMP/arm64-ci.tar" -C Release-arm64 package tests
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-ci
          path: ${{ runner.temp }}/arm64-ci.tar
          if-no-files-found: error
          retention-days: 7

  arm64-tests:
    name: Test Windows ARM64
    needs: arm64
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arm64-ci
      - name: Run ConPTY regressions
        run: |
          tar -xf arm64-ci.tar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/Input.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix = Join-Path $env:RUNNER_TEMP 'conpty-history'
          & ./tests/History.exe (Resolve-Path './package/ConEmu/ConEmuC64.exe').Path (Resolve-Path './tests/HistoryChild.exe').Path $prefix
          $result = $LASTEXITCODE
          Get-Content "$prefix.report"
          if ($result -ne 0) { exit $result }

  package:
    if: github.repository == 'Sim-md/ConEmu' && github.ref == 'refs/heads/main'
    needs: [intel, arm64-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package and verify all three ZIPs
        id: package
        run: |
          mkdir -p artifacts/arm64
          tar -xf artifacts/arm64-ci/arm64-ci.tar -C artifacts/arm64 package
          tag="ci-${GITHUB_SHA:0:7}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 .github/scripts/package-fork-release.py artifacts dist "$GITHUB_SHA" "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: packaged-release
          path: dist/*
          if-no-files-found: error

  updates:
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-2022
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: packaged-release
          path: dist
      - name: Build the native hook probe
        if: matrix.arch != 'arm64'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.arch }} -host_arch=x64
          cl /nologo /O2 /MT /Fe:"%RUNNER_TEMP%\HookUpdateProbe.exe" .github\scripts\fork-update-hook-probe.cpp
      - uses: actions/download-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: arm64-ci
      - name: Extract the ARM64 hook probe
        if: matrix.arch == 'arm64'
        run: |
          tar -xf arm64-ci.tar -C "$env:RUNNER_TEMP" tests/HookUpdateProbe.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "$env:RUNNER_TEMP/tests/HookUpdateProbe.exe" "$env:RUNNER_TEMP/HookUpdateProbe.exe"
      - name: Verify update, rollback and classic hook
        shell: powershell
        run: |
          $archive = (Get-ChildItem dist -Filter '*-${{ matrix.arch }}.zip').FullName
          & .github/scripts/test-fork-update.ps1 -Archive $archive -Architecture ${{ matrix.arch }} -HookProbe "$env:RUNNER_TEMP/HookUpdateProbe.exe"

  release:
    needs: [package, updates]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: packaged-release
          path: dist
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          tag="$TAG"
          version=$(sed -n 's/^version=//p' dist/version.ini | head -n 1)
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "ConEmu $version (${GITHUB_SHA:0:7})" \
            --notes "ARM64, x86 and x64 builds from $GITHUB_SHA. All jobs passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. SHA-256 sums are in SHA256SUMS.txt."
          gh release upload "$tag" dist/*.zip dist/SHA256SUMS.txt dist/version.ini
          gh release edit "$tag" --draft=false --prerelease --latest=false
      - name: Publish version.ini for installed copies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          bash .github/scripts/publish-update-feed.sh dist/version.ini
